name: Slack Archive

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours — comfortably ahead of the 90-day retention limit
  workflow_dispatch:
    inputs:
      force_time_from:
        description: "Override -time-from (YYYY-MM-DDTHH:MM:SS UTC), debugging only"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install slackdump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R rusq/slackdump --pattern '*linux_amd64.deb' -O slackdump.deb --clobber
          sudo dpkg -i slackdump.deb

      - name: Determine export window
        id: window
        run: |
          # Always use a fixed, generous lookback rather than "since last
          # run" — narrow -time-from windows (a few hours) were silently
          # returning zero messages even when messages existed in that
          # window (reproduced: a wide window found them, 5 consecutive
          # narrow incremental windows covering the same period did not).
          # Root cause looks like a slackdump/Slack API quirk with tight
          # time windows, not something we can fix upstream, so we just
          # avoid triggering it. merge_export.py already dedups overlapping
          # snapshots for free, so reprocessing a few days of history every
          # run costs nothing but a bit of API/CPU time.
          if [ -n "${{ github.event.inputs.force_time_from }}" ]; then
            FROM="${{ github.event.inputs.force_time_from }}"
          elif [ -f data/.last_run ]; then
            FROM=$(date -u -d "3 days ago" +%Y-%m-%dT%H:%M:%S)
          else
            FROM=$(date -u -d "89 days ago" +%Y-%m-%dT%H:%M:%S)
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "run_start=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"

      - name: Register Slack workspace
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          echo "SLACK_TOKEN=$SLACK_TOKEN" > secrets.txt
          slackdump workspace import secrets.txt
          rm -f secrets.txt

      - name: Export from Slack
        run: |
          mkdir -p "data/raw/run-${{ steps.window.outputs.run_start }}"
          slackdump export -y \
            -type standard \
            -api-config scripts/api-config.toml \
            -member-only \
            -chan-types public_channel,private_channel \
            -o "data/raw/run-${{ steps.window.outputs.run_start }}" \
            -time-from "${{ steps.window.outputs.from }}"

      - name: Update last-run marker
        run: echo "${{ steps.window.outputs.run_start }}" > data/.last_run

      - name: Commit raw export data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: archive slack messages (${{ steps.window.outputs.run_start }})"
          file_pattern: "data/raw/** data/.last_run"

      - name: Merge snapshots into one deduped export
        run: python3 scripts/merge_export.py

      - name: Install slack-export-viewer
        run: pip install --quiet --break-system-packages slack-export-viewer beautifulsoup4

      - name: Render static site
        run: |
          slack-export-viewer \
            -z data/merged \
            --html-only \
            -o public \
            --thread-note \
            --skip-channel-member-change

      - name: Copy attachments into rendered site
        run: |
          if [ -d data/merged/__attachments ]; then
            mkdir -p public/__attachments
            cp -r data/merged/__attachments/. public/__attachments/
          fi

      - name: Collapse threads and paginate long channels
        run: python3 scripts/postprocess.py

      - name: Inject search widget into pages
        run: python3 scripts/inject_search.py

      - name: Build search index (Pagefind)
        run: npx --yes pagefind --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: export-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
